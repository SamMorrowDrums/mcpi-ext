name: Publish

# Publishing is driven by a GitHub Release, never by a branch push. The release
# tag is the single source of truth for what gets published, and every guard
# below re-derives its answer from that tag rather than trusting the trigger.
on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    # Trusted publishing exchanges a short-lived GitHub OIDC token for npm
    # credentials. There is no NPM_TOKEN anywhere in this workflow, and the
    # environment name is part of the identity npm matches against.
    environment: npm publish

    permissions:
      contents: read
      id-token: write

    steps:
      # Check out the tag itself, not the branch it happened to point at.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false

      - uses: jdx/mise-action@v4
        env:
          # npm's OIDC support requires Node >= 22.14.0.
          MISE_NODE_VERSION: "24"

      # Trusted publishing landed in npm 11.5.1. An older CLI silently falls
      # back to looking for a token, which would fail confusingly rather than
      # loudly, so the version is asserted rather than assumed.
      - name: Install a trusted-publishing capable npm
        run: |
          npm install -g npm@^11.5.1
          node --version
          npm --version

      - name: Record the npm version
        id: npm
        run: echo "version=$(npm --version)" >> "$GITHUB_OUTPUT"

      - name: Require npm >= 11.5.1
        run: |
          node - <<'JS'
          const v = process.env.NPM_VERSION.trim().split(".").map(Number);
          const ok = v[0] > 11 || (v[0] === 11 && (v[1] > 5 || (v[1] === 5 && v[2] >= 1)));
          if (!ok) {
            console.error(`npm ${process.env.NPM_VERSION} predates trusted publishing (need >= 11.5.1)`);
            process.exit(1);
          }
          console.log(`npm ${process.env.NPM_VERSION} supports trusted publishing`);
          JS
        env:
          NPM_VERSION: ${{ steps.npm.outputs.version }}

      # A release is immutable: the tag, the manifest version, and the commit
      # that is actually checked out must agree, and the version must not
      # already exist on the registry. Any disagreement means the artefact
      # would not be the thing the release claims to describe.
      - name: Verify tag, version, and source agree
        id: guard
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          case "$RELEASE_TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::release tag '$RELEASE_TAG' is not a vMAJOR.MINOR.PATCH tag"; exit 1 ;;
          esac

          tag_version="${RELEASE_TAG#v}"
          pkg_version="$(node -p "require('./package.json').version")"
          pkg_name="$(node -p "require('./package.json').name")"

          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::tag $RELEASE_TAG does not match package.json version $pkg_version"
            exit 1
          fi

          # The checkout resolved the tag; confirm HEAD is exactly the commit
          # that tag names, so a moved or re-pointed tag cannot slip through.
          head_sha="$(git rev-parse HEAD)"
          tag_sha="$(git rev-list -n 1 "refs/tags/$RELEASE_TAG")"
          if [ "$head_sha" != "$tag_sha" ]; then
            echo "::error::HEAD $head_sha is not the commit tagged by $RELEASE_TAG ($tag_sha)"
            exit 1
          fi

          if [ "${{ github.event.release.draft }}" = "true" ]; then
            echo "::error::refusing to publish from a draft release"
            exit 1
          fi

          # npm never allows republishing a version. Failing here gives a clear
          # reason instead of an opaque 403 after the build has already run.
          if npm view "$pkg_name@$pkg_version" version --silent >/dev/null 2>&1; then
            echo "::error::$pkg_name@$pkg_version is already published; releases are immutable"
            exit 1
          fi

          if [ "${{ github.event.release.prerelease }}" = "true" ]; then
            dist_tag="next"
          else
            dist_tag="latest"
          fi

          {
            echo "name=$pkg_name"
            echo "version=$pkg_version"
            echo "dist_tag=$dist_tag"
            echo "sha=$head_sha"
          } >> "$GITHUB_OUTPUT"

          echo "publishing $pkg_name@$pkg_version from $head_sha as $dist_tag"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: mise run lint

      - name: Check formatting
        run: mise run format:check

      - name: Type-check
        run: mise run check

      - name: Test
        run: mise run test

      # release-check inspects the tarball npm would pack, so dist/ has to exist
      # before it runs. Nothing earlier in this job emits — check and test both
      # run without output — so the build belongs here rather than after.
      - name: Build release output
        run: npm run build:release

      # Full preflight, including the registry-dependent checks that CI skips.
      - name: Release preflight
        run: node scripts/release-check.mjs

      # Pack the tarball, install it into a throwaway project, and drive the
      # installed artefact. Nothing is published that has not first been proven
      # installable and functional in that form.
      - name: Verify the package a consumer will install
        run: node scripts/verify-package.mjs

      # An exit 0 from npm publish is npm's authoritative acceptance. Registry
      # reads are eventually consistent and must not turn that accepted,
      # immutable publish into a false-red run that invites a second attempt.
      - name: Publish
        id: publish
        run: |
          set -euo pipefail
          npm publish --tag "${{ steps.guard.outputs.dist_tag }}"

          {
            echo "accepted=true"
            echo "name=${{ steps.guard.outputs.name }}"
            echo "version=${{ steps.guard.outputs.version }}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### npm publication accepted"
            echo
            echo "\`npm publish\` exited successfully for \`${{ steps.guard.outputs.name }}@${{ steps.guard.outputs.version }}\` using the \`${{ steps.guard.outputs.dist_tag }}\` dist-tag."
            echo
            echo "This acceptance is authoritative. If registry confirmation below is delayed, do not rerun this workflow or publish again; verify the immutable version directly instead."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Confirm the published version
        id: confirmation
        env:
          PACKAGE_NAME: ${{ steps.guard.outputs.name }}
          PACKAGE_VERSION: ${{ steps.guard.outputs.version }}
        run: node scripts/confirm-published.mjs
